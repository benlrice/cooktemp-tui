[project]
name = "cooktemp-tui"
version = "0.1.0"
description = "Colorful terminal dashboard for a BLE thermometer base and a 433 MHz radio probe"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
cooktemp-tui = "cooktemp_tui.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
